$schema: http://datatorch.io/schema/action.v1.json
name: Hugging Face model
description: Runs a model from the Hugging Face Hub on one image. Object detection and image segmentation return what the model found as annotations; image classification returns what the image is.
inputs:
  imagePath:
    type: string
    required: true
    description: Path of the image on disk
  model:
    type: string
    required: true
    description: >
      The model id on the Hub, e.g. facebook/detr-resnet-50 or
      facebook/mask2former-swin-tiny-coco-instance. A private model needs
      HF_TOKEN in the runner's environment.
  task:
    type: string
    default: object-detection
    options:
      - object-detection
      - image-segmentation
      - image-classification
    description: What the model does
  threshold:
    type: float
    default: 0.5
    description: Keep detections at or above this confidence (0 to 1); classification ignores it
outputs:
  annotations:
    description: Shapes found in the image (detection, segmentation); DataTorch puts them on the file
  classification:
    description: What the image is (classification), the top label with its score and the runners-up
runs:
  using: python
  main: run.py
