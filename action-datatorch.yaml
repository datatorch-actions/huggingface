$schema: http://datatorch.io/schema/action.v1.json
name: Hugging Face model
description: Runs a model from the Hugging Face Hub. Today's tasks, object detection and image segmentation, return what the model found as annotations; more tasks come as DataTorch learns more result types.
inputs:
  imagePath:
    type: string
    required: true
    description: Path of the image on disk
  model:
    type: string
    required: true
    description: >
      The model id on the Hub, e.g. facebook/detr-resnet-50 or
      facebook/mask2former-swin-tiny-coco-instance. A private model needs
      HF_TOKEN in the runner's environment.
  task:
    type: string
    default: object-detection
    options:
      - object-detection
      - image-segmentation
    description: What the model does. More tasks are added as DataTorch gains result types for them.
  threshold:
    type: float
    default: 0.5
    description: Keep results at or above this confidence (0 to 1)
outputs:
  annotations:
    description: Shapes found in the image; DataTorch puts them on the file
runs:
  using: python
  main: run.py
